<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hadorn Studio — Handcrafted Beading & Jewelry</title>
    <meta name="description" content="Hadorn Studio makes handcrafted beadwork, attire and accessories — necklaces, bracelets, earrings and anklets, made by hand. Customise your own piece in 3D." />
    <meta name="theme-color" content="#14100c" />
    <style>html{background:#14100c}#splash{position:fixed;inset:0;z-index:2000;color:#c9a45c}#splash .loader-half{position:absolute;top:0;bottom:0;width:50%;background:#14100c}#splash .loader-half-l{left:0}#splash .loader-half-r{right:0}</style>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hadorn Studio" />
    <meta property="og:title" content="Hadorn Studio — Handcrafted Beading & Jewelry" />
    <meta property="og:description" content="Handcrafted beadwork, attire and accessories. Customise your own piece in 3D or walk through the gallery." />
    <meta property="og:image" content="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <!-- Fonts load without blocking first paint (text swaps in); the noscript copy covers no-JS visitors. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bevan&family=Jost:wght@300;400;500&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bevan&family=Jost:wght@300;400;500&display=swap" /></noscript>
    <!-- The home film's first frame is the LCP image, but React only renders it after the JS arrives; start it now. -->
    <script>
      if (location.pathname === '/') {
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.fetchPriority = 'high';
        l.href = 'https://res.cloudinary.com/qx0i5d58/image/upload/hadorn-3d/hero-v2/' +
          (matchMedia('(max-width: 767px)').matches ? 'mobile' : 'desktop') + '/frame_0001.avif';
        document.head.appendChild(l);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- First-load screen: same loader the app uses everywhere (src/components/common/LoadingScreen.jsx). Removed by src/lib/splash.js. -->
    <div id="splash" class="loader-splash" role="status" aria-label="Loading Hadorn Studio">
      <div class="loader-half loader-half-l"></div>
      <div class="loader-half loader-half-r"></div>
      <div class="loader-screen" style="position:absolute;inset:0;background:transparent">
        <div class="loader-stack">
          <span class="loader-mark brand-svg" aria-hidden="true"><!--splash-mark--></span>
          <span class="loader-word brand-svg" aria-hidden="true"><!--splash-word--></span>
        </div>
      </div>
    </div>
    <noscript><style>#splash{display:none}</style></noscript>
    <script>
      // The splash is the intro for this visit (same look as the home logo intro) — don't play both.
      try { sessionStorage.setItem('hadorn-intro-seen', '1'); } catch (e) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
